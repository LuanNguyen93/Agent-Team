[package]
name = "agent-team-tui"
version = "0.1.0"
edition = "2021"
description = "Agent Team TUI (E0-1: --build-info only; full TUI lands in later stories)"

# No dependencies. build.rs computes srcHash with a hand-rolled SHA-256 so the
# release pipeline never needs network access to fetch a hashing crate.

[[bin]]
name = "agent-team-tui"
path = "src/main.rs"
