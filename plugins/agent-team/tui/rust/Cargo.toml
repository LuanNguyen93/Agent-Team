[package]
name = "agent-team-tui"
version = "0.1.0"
edition = "2021"
description = "Agent Team TUI (E0-1: --build-info only; full TUI lands in later stories)"

# build.rs hand-rolls SHA-256 rather than taking a hashing crate, so srcHash
# is computable with no dependency resolution at all. Runtime dependencies
# are expected and normal (ADR-0002).

[lib]
name = "agent_team_tui"
path = "src/lib.rs"

[[bin]]
name = "agent-team-tui"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "wincon", "minwindef"] }
